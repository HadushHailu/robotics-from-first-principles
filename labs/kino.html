:root[data-theme="light"] {

}

:root[data-theme="dark"] {

}

* {

}

    --foreground,

h2,
h3,
h4,
h5,
h6,

}

}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);

}

b,
strong,

.btn,
.nav-link,
.form-check-input,

.form-range,

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(> .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker > summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;

  height: var(--icon-size) !important;

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    controls.insertAdjacentHTML('afterbegin',`<div class="kino-joint"><span>Target vector · base frame</span><label class="form-label" for="kino-target-x">x (m)</label><input class="form-control" id="kino-target-x" type="number" step="0.1" value="4"><label class="form-label" for="kino-target-y">y (m)</label><input class="form-control" id="kino-target-y" type="number" step="0.1" value="3"><div class="viz-row"><button type="button" class="btn btn-primary" id="kino-go">Go there</button><button type="button" class="btn" id="kino-stop" disabled>Stop</button></div><span class="text-small">Proportional link scaling · base joint turns as needed</span></div>`);

    matrixPanel.innerHTML=`<span>Scale the coordinate directions</span><span class="text-small">Apply a scaling matrix to the EE position vector. Kino stays visible as the original reference.</span><label class="form-label" for="kino-scale-mode">Scale</label><select class="form-select" id="kino-scale-mode"><option value="both">î and ĵ</option><option value="i">î only</option><option value="j">ĵ only</option></select><label class="form-label" for="kino-scale-x">î scale · sₓ</label><input class="form-control" id="kino-scale-x" type="number" min="-5" max="5" step="0.1" value="1"><label class="form-label" for="kino-scale-y">ĵ scale · sᵧ</label><input class="form-control" id="kino-scale-y" type="number" min="-5" max="5" step="0.1" value="1"><div id="kino-matrix-readout" class="tabular-nums" aria-live="polite"></div><label class="form-check"><input class="form-check-input" type="checkbox" id="kino-scaled-grid" checked><span class="form-check-label">Show scaled grid</span></label><button type="button" class="btn" id="kino-matrix-reset">Reset to identity</button>`;

      }
      if(motionProgress){
        const [sx,sy]=motionProgress.start,[cx,cy]=motionProgress.current;
        const dx=cx-sx,dy=cy-sy;
        const clean=v=>Math.abs(v)<.0005?0:v;
        const basisArrow=(ax,ay,bx,by,color)=>{
          const x1=X(ax),y1=Y(ay),x2=X(bx),y2=Y(by),len=Math.hypot(x2-x1,y2-y1);
          if(len<.4)return;
          const a=Math.atan2(y2-y1,x2-x1),tip=Math.min(7,len*.4);
          el('line',{x1,y1,x2,y2,stroke:'var(--background)','stroke-width':6});
          el('line',{x1,y1,x2,y2,stroke:color,'stroke-width':2.5});
          el('path',{d:`M ${x2-tip*Math.cos(a-.45)} ${y2-tip*Math.sin(a-.45)} L ${x2} ${y2} L ${x2-tip*Math.cos(a+.45)} ${y2-tip*Math.sin(a+.45)}`,fill:'none',stroke:color,'stroke-width':2.5});
        };
        const xsign=Math.sign(dx),ysign=Math.sign(dy);
        for(let u=0;u<Math.abs(dx)-1e-8;u++){
          const v=Math.min(u+1,Math.abs(dx));
          basisArrow(sx+xsign*u,sy,sx+xsign*v,sy,'var(--viz-series-1)');
        }
        for(let u=0;u<Math.abs(dy)-1e-8;u++){
          const v=Math.min(u+1,Math.abs(dy));
          basisArrow(cx,sy+ysign*u,cx,sy+ysign*v,'var(--viz-series-3)');
        }
        const label=(x,y,text,anchor)=>{
          const n=el('text',{x,y,'text-anchor':anchor,stroke:'var(--background)','stroke-width':4,'stroke-linejoin':'round','paint-order':'stroke'},text);
          return n;
        };
        if(Math.abs(dx)>.02)label(X((sx+cx)/2),Y(sy)+24,`${clean(dx).toFixed(2)} î m`,'middle');
        if(Math.abs(dy)>.02)label(X(cx)+12,Y((sy+cy)/2),`${clean(dy).toFixed(2)} ĵ m`,'start');
        basisReadout.textContent=`Travelled: ${clean(dx).toFixed(2)} î ${dy<-.0005?'−':'+'} ${Math.abs(clean(dy)).toFixed(2)} ĵ m · Each full arrow = 1 m`;
      }else{basisReadout.textContent='';}
      // Absolute position components measured on the base-frame axes.
      const axisComponent=(value,isX,color)=>{
        const sign=Math.sign(value);
        for(let k=0;k<Math.abs(value)-1e-8;k++){
          const a=sign*k,b=sign*Math.min(k+1,Math.abs(value));
          const x1=isX?X(a):ox,y1=isX?oy:Y(a),x2=isX?X(b):ox,y2=isX?oy:Y(b);
          const len=Math.hypot(x2-x1,y2-y1),theta=Math.atan2(y2-y1,x2-x1),tip=Math.min(7,len*.4);
          el('line',{x1,y1,x2,y2,stroke:color,'stroke-width':3});
          el('path',{d:`M ${x2-tip*Math.cos(theta-.45)} ${y2-tip*Math.sin(theta-.45)} L ${x2} ${y2} L ${x2-tip*Math.cos(theta+.45)} ${y2-tip*Math.sin(theta+.45)}`,fill:'none',stroke:color,'stroke-width':2.5});
        }
      };
      if(!state.projection&&!state.matrix){
      el('line',{x1:ex,y1:ey,x2:ex,y2:oy,stroke:'var(--viz-series-1)','stroke-width':1.5,'stroke-dasharray':'3 5'});
      el('line',{x1:ex,y1:ey,x2:ox,y2:ey,stroke:'var(--viz-series-3)','stroke-width':1.5,'stroke-dasharray':'3 5'});
      axisComponent(end[0],true,'var(--viz-series-1)');
      axisComponent(end[1],false,'var(--viz-series-3)');
      }
      const cleanCoord=v=>(Math.abs(v)<.005?0:v).toFixed(2);
      const axisLabel=(x,y,text,anchor)=>el('text',{x,y,'text-anchor':anchor,stroke:'var(--background)','stroke-width':4,'stroke-linejoin':'round','paint-order':'stroke'},text);
      if(!state.projection&&!state.matrix){
      axisLabel(ex,oy-16,`${cleanCoord(end[0])} î m`,'middle');
      axisLabel(ox+14,ey-10,`${cleanCoord(end[1])} ĵ m`,'start');
      output.textContent=`End effector P = (${end[0].toFixed(2)}, ${end[1].toFixed(2)}) m`;
      }
      if(state.projection){
        const modes=projectOn.value==='both'?[[1,0,'î','var(--viz-series-1)'],[0,1,'ĵ','var(--viz-series-3)']]:projectOn.value==='i'?[[1,0,'î','var(--viz-series-1)']]:projectOn.value==='j'?[[0,1,'ĵ','var(--viz-series-3)']]:(basisValid()?(projectOn.value==='custom1'?[[...direction(),'b̂₁','var(--viz-series-4)']]:projectOn.value==='custom2'?[[...directionB(),'b̂₂','var(--viz-series-5)']]:[[...direction(),'b̂₁','var(--viz-series-4)'],[...directionB(),'b̂₂','var(--viz-series-5)']]):[]);
        const descriptions=[];
        for(const [ax,ay,name,color] of modes){
          const norm=Math.hypot(ax,ay);if(!Number.isFinite(norm)||norm<1e-9||norm>40){output.textContent='Choose a nonzero projection vector of length at most 40.';continue;}
          const ux=ax/norm,uy=ay/norm,s=end[0]*ux+end[1]*uy,qx=s*ux,qy=s*uy;
          const arrow=(x1,y1,x2,y2,width=2.5,arrowColor=color)=>{
            const a=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1),tip=Math.min(8,len*.4);if(len<.1)return;
            el('line',{x1,y1,x2,y2,stroke:arrowColor,'stroke-width':width});
            el('path',{d:`M ${x2-tip*Math.cos(a-.45)} ${y2-tip*Math.sin(a-.45)} L ${x2} ${y2} L ${x2-tip*Math.cos(a+.45)} ${y2-tip*Math.sin(a+.45)}`,fill:'none',stroke:arrowColor,'stroke-width':width});
          };
          if(customBasis()){
            el('line',{x1:X(-ux*reach),y1:Y(-uy*reach),x2:X(ux*reach),y2:Y(uy*reach),stroke:'var(--border)','stroke-width':1});

            axisLabel(X(ax)+10,Y(ay)-15,`${name==='b̂₁'?'b₁':'b₂'} = (${ax.toFixed(2)}, ${ay.toFixed(2)})`,'start');
          }
          if(customBasis()){
            const basisColor='#0072B2';
            // Draw basis arrows first so cascaded unit arrows remain on top.
            arrow(ox,oy,X(ax),Y(ay),6,'var(--background)');
            arrow(ox,oy,X(ax),Y(ay),3.5,basisColor);
            el('circle',{cx:X(ax),cy:Y(ay),r:5,fill:basisColor,stroke:'var(--background)','stroke-width':1.5});
          }
          for(let k=0;k<Math.abs(s)-1e-8;k++){
            const v=Math.sign(s)*k,w=Math.sign(s)*Math.min(k+1,Math.abs(s));
            arrow(X(v*ux),Y(v*uy),X(w*ux),Y(w*uy));
          }
          el('line',{x1:ex,y1:ey,x2:X(qx),y2:Y(qy),stroke:color,'stroke-width':1.5,'stroke-dasharray':'4 5'});
          el('circle',{cx:X(qx),cy:Y(qy),r:4,fill:'var(--background)',stroke:color,'stroke-width':1.5});
          const residual=Math.hypot(end[0]-qx,end[1]-qy);
          if(residual*scale>12&&Math.abs(s)*scale>12){
            const vx=(end[0]-qx)/residual,vy=(end[1]-qy)/residual,z=8/scale,sign=Math.sign(s);
            el('path',{d:`M ${X(qx-sign*ux*z)} ${Y(qy-sign*uy*z)} L ${X(qx-sign*ux*z+vx*z)} ${Y(qy-sign*uy*z+vy*z)} L ${X(qx+vx*z)} ${Y(qy+vy*z)}`,fill:'none',stroke:'var(--foreground)','stroke-width':1});
          }
          axisLabel(X(qx)+12,Y(qy)+22,`${cleanCoord(s)} ${name} m`,'start');
          descriptions.push(`proj${name}(P) = ${cleanCoord(s)} ${name} m`);
        }
        if(descriptions.length)output.textContent=descriptions.join(' · ')+' · Each full arrow = 1 m along the unit direction';
        if(customBasis()){
          if(!basisValid())output.textContent='A basis requires two nonzero, nonparallel vectors.';
          else{
            const a=direction(),b=directionB(),det=a[0]*b[1]-a[1]*b[0];
            const c1=(b[1]*end[0]-b[0]*end[1])/det,c2=(-a[1]*end[0]+a[0]*end[1])/det;
            basisReadout.textContent=`New basis coordinates: P = ${c1.toFixed(2)} b₁ ${c2<0?'−':'+'} ${Math.abs(c2).toFixed(2)} b₂. Projections use perpendicular drops; these coordinates use basis decomposition.`;
          }
        }

      }
      if(state.matrix){
        const [sx,sy]=matrixScale,px=end[0],py=end[1],qx=sx*px,qy=sy*py;
        const vector=(x,y,color,label,width)=>{
          const tx=X(x),ty=Y(y),a=Math.atan2(ty-oy,tx-ox);
          el('line',{x1:ox,y1:oy,x2:tx,y2:ty,stroke:color,'stroke-width':width});
          if(Math.hypot(x,y)>1e-8)el('path',{d:`M ${tx-10*Math.cos(a-.4)} ${ty-10*Math.sin(a-.4)} L ${tx} ${ty} L ${tx-10*Math.cos(a+.4)} ${ty-10*Math.sin(a+.4)}`,fill:'none',stroke:color,'stroke-width':width});
          el('text',{x:tx+12,y:ty-12,stroke:'var(--background)','stroke-width':4,'paint-order':'stroke'},label);
        };
        vector(px,py,'var(--muted-foreground)','P · original',1.5);
        vector(qx,qy,'var(--viz-series-4)','A P · scaled',3);
        vector(sx,0,'#0072B2',`${sx.toFixed(2)} î`,4);
        vector(0,sy,'#0072B2',`${sy.toFixed(2)} ĵ`,4);
        matrixReadout.innerHTML=`<div>A =</div><table class="table table-sm" aria-label="Scaling matrix"><tbody><tr><td>${sx.toFixed(2)}</td><td>0</td></tr><tr><td>0</td><td>${sy.toFixed(2)}</td></tr></tbody></table><div>P = (${px.toFixed(2)}, ${py.toFixed(2)}) m</div><div>A P = (${qx.toFixed(2)}, ${qy.toFixed(2)}) m</div><div>A î = (${sx.toFixed(2)}, 0)</div><div>A ĵ = (0, ${sy.toFixed(2)})</div>`;
      }

    }
    for(let i=0;i<3;i++){
      root.querySelector(`#kino-length-${i}`).addEventListener('input',e=>{const v=e.target.valueAsNumber;if(!Number.isFinite(v)||v<.1||v>10){error.textContent='Enter a link length between 0.1 and 10 m.';return;}error.textContent='';state.lengths[i]=v;draw();save();});
      root.querySelector(`#kino-angle-${i}`).addEventListener('input',e=>{if(state.locked[i])return;state.angles[i]=Number(e.target.value);root.querySelector(`#kino-value-${i}`).textContent=`${Number(state.angles[i].toFixed(1))}°`;draw();save();});
      root.querySelector(`#kino-lock-${i}`).addEventListener('change',e=>{state.locked[i]=e.target.checked;sync();draw();save();});
    }
    root.querySelector('#kino-background').addEventListener('change',e=>{state.background=e.target.checked;draw();save();});
    window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.modelContent;if(valid(incoming)&&incoming.poseVersion===2){state=structuredClone(incoming);sync();draw();}});
    sync();const initialMode=new URLSearchParams(location.search).get('mode');if(initialMode==='projection')projectionButton.click();else if(initialMode==='matrix')matrixButton.click();else setupButton.click();new ResizeObserver(draw).observe(root);window.addEventListener('resize',draw);draw();
  })();
  </script>
</div></body></html>
